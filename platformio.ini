; Optional: build with PlatformIO instead of the Arduino IDE.
;   pio run -t upload
[platformio]
src_dir = PocketPet

[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps = m5stack/M5Unified@^0.2.28
